name: Build Modular Friends social images
on:
  push:
    paths:
      - '.github/workflows/social-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Generate authentic-photo social assets
        run: python social/render-social.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/*.jpg
          git diff --cached --quiet || (git commit -m "Render official-photo Instagram calendar graphics" && git push)
