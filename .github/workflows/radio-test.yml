name: Verify published radio
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Sync Modular Friends Radio']
    types: [completed]
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/radio-player.cjs
      - run: node tests/radio-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-browser-evidence
          path: test-results/
